[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "timme"
authors = [
    {name = "Ross Wightman", email = "ross@huggingface.co"},
]
description = "PyTorch image models, evolved — encoder/head architecture split layered on timm"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["pytorch", "image-classification", "timm", "vision-transformer"]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "timm>=1.0",
]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/rwightman/timme"
repository = "https://github.com/rwightman/timme"

[tool.pdm.version]
source = "file"
path = "src/timme/__init__.py"

[tool.pdm.build]
package-dir = "src"

[tool.pdm.dev-dependencies]
test = [
    "pytest",
    "pytest-xdist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.wruff]
line-length = 120

[tool.wruff.format]
quote-style = "preserve"
preview = true
